<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浮标应急采样 · 受限委托核验</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>海洋观测浮标失联应急采样 · 受限委托核验</h1>
  <p class="sub">岸站离线委托按 JCS（RFC 8785）规范 JSON 字节逐份验签：乱序委托集合的授权路径搜索，或按顺序排列的单链逐跳核验</p>
</header>

<main>
  <section class="panel">
    <h2>核验模式</h2>
    <div class="modes" role="tablist">
      <button type="button" id="modeGraph" class="mode active">委托图核验（乱序集合）</button>
      <button type="button" id="modeChain" class="mode ghost">单链核验（旧接口）</button>
    </div>
  </section>

  <!-- 委托图核验输入 -->
  <section class="panel" id="graphPanel">
    <h2>输入 · 授权状态图</h2>
    <label for="rootKey">根公钥（P-256 JWK，规范 JSON）</label>
    <textarea id="rootKey" rows="2" spellcheck="false"
      placeholder='{"crv":"P-256","kty":"EC","x":"…","y":"…"}'></textarea>

    <label for="objects">委托集合（乱序缓存，每行一份 delegation 规范 JSON；顺序无关，自动去重）</label>
    <textarea id="objects" rows="10" spellcheck="false"
      placeholder='{"aud":[…],"exp":…,"iss":{…},"maxSamples":…,"nbf":…,"sig":"…","sub":{…},"typ":"delegation"}'></textarea>

    <div class="grid2">
      <div>
        <label for="targetKey">目标主体公钥（P-256 JWK，规范 JSON）</label>
        <textarea id="targetKey" rows="2" spellcheck="false"
          placeholder='{"crv":"P-256","kty":"EC","x":"…","y":"…"}'></textarea>
      </div>
      <div>
        <label for="now">评估时刻（unix 秒，留空取服务器当前时间）</label>
        <input id="now" type="text" inputmode="numeric" placeholder="例如 1790000000">
        <label for="buoy">目标浮标</label>
        <input id="buoy" type="text" placeholder="例如 buoy-01">
        <label for="samples">采样量</label>
        <input id="samples" type="text" inputmode="numeric" placeholder="例如 10">
      </div>
    </div>

    <div class="actions">
      <button id="verifyBtn" type="button">搜索授权路径</button>
      <button id="clearBtn" type="button" class="ghost">清空</button>
    </div>
  </section>

  <section class="panel" id="errorPanel" hidden>
    <h2>拒绝原因（错误草稿，不覆盖有效证据）</h2>
    <div id="errorBody" class="error"></div>
  </section>

  <section class="panel" id="evidencePanel" hidden>
    <h2>证据路径、逐跳收紧与最终结论</h2>
    <div id="verdict"></div>
    <table id="hopTable">
      <thead>
        <tr>
          <th>跳</th><th>类型</th><th>签名（sig）</th><th>规范载荷摘要（SHA-256）</th>
          <th>签发者指纹</th><th>主体指纹</th><th>收紧后的约束</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="finalConstraints"></div>
    <div id="reachedBlock"></div>
  </section>
</main>

<footer>
  <p>规范：JCS (RFC 8785) 规范 JSON 字节 · ECDSA P-256/SHA-256（P1363）· 约束状态图单调收紧传播 · 更宽约束支配较窄状态 · 仅允许时间窗 / 浮标集合 / 采样上限收紧</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
